<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="module" src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.5.0/dist/index.js"></script>
</head>
<body>
  <div id="root">📍 Detecting location&hellip;</div>
  <script>
    const { Streamlit } = await import("https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.5.0/dist/index.js");
    const root = document.getElementById("root");

    function setText(text) { root.innerText = text; }

    function setCoords(lat, lng) {
      setText(`📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
      Streamlit.setData({ lat, lng });
    }

    Streamlit.setComponentReady();

    if (!navigator.geolocation) {
      setText("📍 Unavailable");
      Streamlit.setData({});
    } else {
      navigator.geolocation.getCurrentPosition(
        (pos) => setCoords(pos.coords.latitude, pos.coords.longitude),
        () => {
          setText("📍 Unavailable");
          Streamlit.setData({});
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    }
  </script>
</body>
</html>
